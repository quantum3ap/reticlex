name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core and front end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake

      - name: Build the native core and run its tests
        run: ./scripts/build-core.sh build/core

      - name: Check the golden fixtures are current
        # The fixtures are generated by the native build and asserted against
        # the WebAssembly build, so a stale commit would hide a real drift.
        run: |
          if ! git diff --exit-code -- frontend/tests/fixtures/; then
            echo "::error::Golden fixtures are out of date. Run scripts/build-core.sh and commit the result."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test` only accepts a glob pattern from 21 on.
          node-version: '22'

      - name: Run the front-end tests
        working-directory: frontend
        run: node --test "tests/*.test.js"

      - name: Check the built-in presets are current
        run: |
          node scripts/build-presets.mjs
          if ! git diff --exit-code -- presets/; then
            echo "::error::presets/builtin.json is out of date. Run scripts/build-presets.mjs and commit the result."
            exit 1
          fi

      - name: Upload the WebAssembly module
        uses: actions/upload-artifact@v4
        with:
          name: reticlex-core-wasm
          path: frontend/assets/reticlex_core.wasm
          retention-days: 7

  managed-linux:
    name: Managed core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the native core
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core -j4

      - name: Run the managed tests
        # ReticleX.Core is deliberately platform-neutral, so the storage,
        # serialization and interop tests run here as well as on Windows.
        run: >
          dotnet test desktop/csharp/ReticleX.Tests/ReticleX.Tests.csproj
          -c Release
          -p:ReticleXNativeLibrary=${{ github.workspace }}/build/core/libreticlex_core.so
          --logger "console;verbosity=normal"

  windows:
    name: Desktop application (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the native core and run its tests
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Build the solution
        shell: pwsh
        # Both properties: the App copies the DLL beside the executable, the
        # test project copies it beside the test binary. The test step below
        # uses --no-build, so it has to be placed here.
        run: >
          dotnet build desktop/csharp/ReticleX.sln -c Release --nologo
          -p:ReticleXNativeDll=${{ github.workspace }}\build\native\Release\reticlex_core.dll
          -p:ReticleXNativeLibrary=${{ github.workspace }}\build\native\Release\reticlex_core.dll

      - name: Run the managed tests
        shell: pwsh
        run: >
          dotnet test desktop/csharp/ReticleX.Tests/ReticleX.Tests.csproj -c Release --no-build
          -p:ReticleXNativeLibrary=${{ github.workspace }}\build\native\Release\reticlex_core.dll
          --logger "console;verbosity=normal"

      - name: Package a smoke-test build
        # Proves the packaging path works on every push, not only at release.
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.0.0-ci -SkipInstaller

      - name: Upload the smoke-test build
        uses: actions/upload-artifact@v4
        with:
          name: reticlex-windows-ci
          path: build/artifacts/*
          retention-days: 7
