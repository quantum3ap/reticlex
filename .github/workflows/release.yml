name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  verify:
    name: Verify and build the core
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a valid version."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building ReticleX $version"

      - name: Install the WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake

      - name: Build the core, run its tests and rebuild the WebAssembly module
        run: ./scripts/build-core.sh build/core

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test` only accepts a glob pattern from 21 on.
          node-version: '22'

      - name: Run the front-end tests
        working-directory: frontend
        run: node --test "tests/*.test.js"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run the managed tests
        run: >
          dotnet test desktop/csharp/ReticleX.Tests/ReticleX.Tests.csproj
          -c Release
          -p:ReticleXNativeLibrary=${{ github.workspace }}/build/core/libreticlex_core.so

      - name: Upload the freshly built WebAssembly module
        # The Windows job ships exactly the module these tests just passed
        # against, rather than whatever happens to be committed.
        uses: actions/upload-artifact@v4
        with:
          name: reticlex-core-wasm
          path: frontend/assets/reticlex_core.wasm
          retention-days: 1

  package:
    name: Build the Windows release
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Take the verified WebAssembly module
        uses: actions/download-artifact@v4
        with:
          name: reticlex-core-wasm
          path: frontend/assets

      - name: Build the native core and run its tests
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Run the managed tests
        shell: pwsh
        run: >
          dotnet test desktop/csharp/ReticleX.Tests/ReticleX.Tests.csproj -c Release
          -p:ReticleXNativeLibrary=${{ github.workspace }}\build\native\Release\reticlex_core.dll

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Package the installer and the portable build
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ needs.verify.outputs.version }}

      - name: Check the artifacts exist
        shell: pwsh
        run: |
          $version = '${{ needs.verify.outputs.version }}'
          $expected = @(
            "build/artifacts/ReticleX-v$version-Setup.exe",
            "build/artifacts/ReticleX-v$version-Portable.exe",
            "build/artifacts/ReticleX-v$version-Portable.zip"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing artifact: $path" }
            $size = (Get-Item $path).Length
            if ($size -lt 500KB) { throw "$path is only $size bytes, which cannot be right." }
            '{0,-46} {1,12:N0} bytes' -f (Split-Path $path -Leaf), $size | Write-Host
          }

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reticlex-windows-${{ needs.verify.outputs.version }}
          path: build/artifacts/*
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ReticleX ${{ needs.verify.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            build/artifacts/ReticleX-v${{ needs.verify.outputs.version }}-Setup.exe
            build/artifacts/ReticleX-v${{ needs.verify.outputs.version }}-Portable.exe
            build/artifacts/ReticleX-v${{ needs.verify.outputs.version }}-Portable.zip
          body: |
            ## ReticleX ${{ needs.verify.outputs.version }}

            **Which download do I want?**

            | File | Use it when |
            |------|-------------|
            | `ReticleX-v${{ needs.verify.outputs.version }}-Setup.exe` | You want it installed. Per user, no administrator prompt, adds a Start menu entry. |
            | `ReticleX-v${{ needs.verify.outputs.version }}-Portable.exe` | You want to run it without installing, from anywhere including a USB stick. |
            | `ReticleX-v${{ needs.verify.outputs.version }}-Portable.zip` | The portable build with its content folder, for offline or air-gapped machines. |

            Windows 10 1809 or newer, 64-bit. The Microsoft Edge WebView2
            runtime is required and is already present on Windows 11 and
            up-to-date Windows 10; the installer offers to fetch it if it is
            missing.

            Your crosshairs and settings live in `%APPDATA%\ReticleX`.
